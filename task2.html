<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Webpage</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        /* Navbar Styling */
        .navbar {
            background-color: #007bff;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        /* Card Styling */
        .card img {
            height: 200px;
            object-fit: cover;
        }

        /* Media Queries */
        @media screen and (max-width: 768px) {
            body {
                background-color: #f0f8ff;
            }

            h1 {
                font-size: 24px;
            }

            .card {
                margin-bottom: 20px;
            }
        }

        @media screen and (max-width: 480px) {
            h1 {
                font-size: 20px;
            }

            p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- Mobile Friendly Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">My Website</a>

            <!-- Hamburger Button -->
            <button class="navbar-toggler bg-light"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu">

                ☰
            </button>

            <!-- Menu Links -->
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Heading -->
    <div class="container text-center mt-4">
        <h1>Responsive Webpage</h1>
        <p>This webpage adapts to different screen sizes.</p>
    </div>

    <!-- Responsive Grid Layout -->
    <div class="container mt-5">
        <div class="row">

            <!-- Card 1 -->
            <div class="col-lg-4 col-md-6 col-sm-12">
                <div class="card shadow">
                    <img src=https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRVkec5GkHXqKQnkGB5KrU2x2NNkRQmcmxF-vxekGwfuJOVJn0N9VGGf30&s=10
                         class="card-img-top"
                         alt="Image">

                    <div class="card-body">
                        <h5 class="card-title">Card Title 1</h5>
                        <p class="card-text">
                            This is a responsive card using Bootstrap.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="col-lg-4 col-md-6 col-sm-12">
                <div class="card shadow">
                    <img src=https://tinypng.com/_next/static/media/boat.641e4e5c.png
                         class="card-img-top"
                         alt="Image">

                    <div class="card-body">
                        <h5 class="card-title">Card Title 2</h5>
                        <p class="card-text">
                            Responsive grid layout example.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="col-lg-4 col-md-12 col-sm-12">
                <div class="card shadow">
                    <img src=https://www.shutterstock.com/image-photo/incredible-sunset-paints-sky-water-600nw-2760803657.jpg
                         class="card-img-top"
                         alt="Image">

                    <div class="card-body">
                        <h5 class="card-title">Card Title 3</h5>
                        <p class="card-text">
                            Mobile-friendly responsive design.
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
